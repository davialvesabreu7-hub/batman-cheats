<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Admin | Batman Cheats</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090e;color:#f6f5fb;font-family:system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:36px auto}h1{margin-bottom:6px}p{color:#aaa7bb;line-height:1.6}.panel{background:#15151f;border:1px solid #ffffff1a;border-radius:16px;padding:20px;margin:18px 0}input{width:100%;padding:12px;border:1px solid #ffffff22;border-radius:9px;background:#08080c;color:white;margin:8px 0 12px}button{background:#8d4df1;color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.error{color:#ffaaa8}.msg{color:#9effca}.order{border-top:1px solid #ffffff18;padding:15px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.order:first-child{border-top:0}.tag{font-size:12px;padding:5px 8px;border-radius:20px;background:#9b5cff22;color:#d8c2ff;display:inline-block}.tag.paid{background:#55e6a51c;color:#9effca}@media(max-width:600px){.order{grid-template-columns:1fr}.order button{width:100%}}</style></head><body><main class="wrap"><h1>🦇 BATMAN CHEATS — Admin</h1><p>Confirme apenas depois de verificar o crédito real no aplicativo do banco.</p><section id="loginPanel" class="panel"><h2>Entrar</h2><form id="loginForm"><label>Senha de administrador<input type="password" id="password" autocomplete="current-password" required></label><button>Entrar no painel</button></form><p id="loginMsg"></p></section><section id="ordersPanel" class="panel" hidden><div class="row"><h2>Pedidos recentes</h2><div><button id="refresh">Atualizar</button> <button id="logout">Sair</button></div></div><p id="ordersMsg"></p><div id="orders"></div></section></main><script>
let token=sessionStorage.getItem('batmanAdminToken')||'';
const loginPanel=document.querySelector('#loginPanel'),ordersPanel=document.querySelector('#ordersPanel'),loginMsg=document.querySelector('#loginMsg'),ordersMsg=document.querySelector('#ordersMsg'),ordersDiv=document.querySelector('#orders');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadOrders(){ordersMsg.textContent='Carregando…';try{const r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao carregar pedidos');ordersDiv.innerHTML=d.length?d.map(o=>`<article class="order"><div><span class="tag ${o.status==='paid'?'paid':''}">${o.status==='paid'?'PAGO — CONFIRMADO':'PENDENTE'}</span><h3>${esc(o.product)} — ${esc(o.amount)}</h3><p>Cliente: ${esc(o.customer_name)}<br>E-mail: ${esc(o.customer_email)}<br>Telefone: ${esc(o.customer_phone||'não informado')}<br>Pedido: ${esc(o.id)}<br>Data: ${esc(new Date(o.created_at).toLocaleString('pt-BR'))}</p></div><div>${o.status==='paid'?'':`<button data-confirm="${esc(o.id)}">Confirmar pagamento</button>`}</div></article>`).join(''):'Nenhum pedido cadastrado.';ordersMsg.textContent='';ordersDiv.querySelectorAll('[data-confirm]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Você verificou o crédito real no banco para este pedido?'))return;b.disabled=true;try{const r=await fetch('/api/admin/orders/'+encodeURIComponent(b.dataset.confirm)+'/confirm',{method:'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha');ordersMsg.textContent=d.message||d.warning||'Atualizado';await loadOrders();}catch(e){ordersMsg.textContent=e.message;}finally{b.disabled=false;}}));}catch(e){ordersMsg.textContent=e.message;ordersMsg.className='error';if(e.message.toLowerCase().includes('sessão')||e.message.toLowerCase().includes('login'))logoutNow();}}
document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMsg.textContent='Entrando…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha no login');token=d.token;sessionStorage.setItem('batmanAdminToken',token);showAdmin();await loadOrders();}catch(e){loginMsg.textContent=e.message;loginMsg.className='error';}});
function showAdmin(){loginPanel.hidden=true;ordersPanel.hidden=false}
function logoutNow(){token='';sessionStorage.removeItem('batmanAdminToken');loginPanel.hidden=false;ordersPanel.hidden=true}
document.querySelector('#refresh').addEventListener('click',loadOrders);
document.querySelector('#logout').addEventListener('click',async()=>{try{await fetch('/api/admin/logout',{method:'POST',headers:{Authorization:'Bearer '+token}})}finally{logoutNow()}});
if(token){showAdmin();loadOrders()}
</script></body></html>
